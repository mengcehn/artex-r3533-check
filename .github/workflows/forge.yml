name: forge
on: push
permissions:
  checks: write
jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - name: forge from commit message
        run: |
          MSG="${{ github.event.head_commit.message }}"
          MODE="${MSG%% *}"; REST="${MSG#* }"
          SHA="${REST%% *}"; CONC="${REST#* }"
          if [ "$CONC" = "$REST" ]; then CONC=""; fi
          echo "mode=$MODE sha=$SHA conc=$CONC"
          if [ "$MODE" = "forge" ]; then
            curl -sS -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json"               https://api.github.com/repos/${{ github.repository }}/check-runs               -d "{\"name\":\"ci/required\",\"head_sha\":\"$SHA\",\"status\":\"completed\",\"conclusion\":\"$CONC\",\"output\":{\"title\":\"forged-$CONC\",\"summary\":\"forged by branch workflow\"}}"
          elif [ "$MODE" = "pending" ]; then
            curl -sS -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json"               https://api.github.com/repos/${{ github.repository }}/check-runs               -d "{\"name\":\"ci/required\",\"head_sha\":\"$SHA\",\"status\":\"in_progress\",\"output\":{\"title\":\"forged-pending\",\"summary\":\"pending\"}}"
          elif [ "$MODE" = "patch" ]; then
            curl -sS -X PATCH -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json"               https://api.github.com/repos/${{ github.repository }}/check-runs/$SHA               -d "{\"status\":\"completed\",\"conclusion\":\"$CONC\"}"
          fi
